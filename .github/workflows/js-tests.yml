# .github/workflows/js-tests.yml
name: JS Tests

on:
  workflow_call:

jobs:
  check:
    name: JS & TS checks
    # One 32-core job replaces a 14-leg matrix. The matrix spread about 612s
    # of check payload over 4-core runners. It paid about 371s of repeated
    # setup to do it: 14 checkouts, 14 node installs, 14 node_modules
    # restores.
    #
    # One larger runner installs one time. vitest, tsc and eslint each size
    # their own worker pool from the core count.
    runs-on: ubuntu-latest-32-core
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: grab npm 12
        run: |
          # Digest-pinned npm bootstrap (A3 final): the trusted installer
          # downloads the EXACT canonical tarball, verifies its sha256 against
          # supply-chain/npm-bootstrap.json BEFORE install, then installs the
          # local tarball with --ignore-scripts --offline. No registry-metadata
          # trust. No-op when the exact version is already present.
          npm --version | grep -qx '12.0.2' || node scripts/ci/install-npm-pinned.mjs

      # A3 (final): NO node_modules cache. A restore/save cache would let a
      # poisoned tree carry a matching-but-forged provenance marker stored INSIDE
      # the cache (checksums.json and the cache-provenance marker both travel with
      # the cached bytes), so the only sound posture is to remove the cache
      # entirely. Every run installs fresh from the trusted, committed lockfile
      # with `npm ci --ignore-scripts`, then runs ONLY the reviewed allowlisted
      # lifecycle. There is no cache key and no cache-hit path to trust.
      - uses: ./.github/actions/retry
        with:
          # A4: install WITHOUT running lifecycle scripts (npm 10 ignores
          # package.json allowScripts, so --ignore-scripts is the only
          # version-independent guarantee no dependency runs arbitrary
          # install-time code). The reviewed allowlisted native lifecycle runs
          # in the next step. get-windows is never rebuilt.
          command: npm ci --ignore-scripts

      # Run ONLY the reviewed, allowlisted lifecycle scripts (electron binary,
      # node-pty prebuild, esbuild, fsevents) that the workspace checks below
      # (desktop electron + TUI suites) depend on. get-windows is on the
      # orchestrator deny-list (NEVER_RUN) and is never rebuilt.
      - name: Run allowlisted lifecycle scripts (A4)
        run: node apps/desktop/scripts/run-allowed-lifecycle.mjs

      # A3: independent native/executable provenance verification of the freshly
      # installed tree BEFORE any test runs. The pre-build gate ties
      # package.json electronVersion, lock integrity, and the target's
      # checksums.json entry to the reviewed manifest; an unsafe tree fails
      # closed here and the tests never run against it.
      - name: Verify native payload provenance (pre-test)
        run: node apps/desktop/scripts/verify-native-payloads.mjs

      # Every check runs at the same time. The step fails only after all of
      # them finish. There are two reasons this is not ``npm run --ws check``.
      #
      #   * ``--ws`` is serial and stops at the first workspace that fails. A
      #     run then reports one failure, where the matrix this replaced
      #     reported every failure together.
      #   * The unit of work is a CHECK, and not a workspace. apps/desktop is
      #     most of the payload, and its own ``check`` is a serial && chain.
      #     A spread across workspaces alone leaves that chain as the long
      #     pole. This expands the ``check:*`` sub-scripts of a package, so
      #     its lint, ui, electron and plugin suites all run together. That
      #     is the same selection rule the old matrix job used.
      #
      # Discovery is ``npm query .workspace``. A new package or a new
      # ``check:*`` script needs no change here. An empty list is an error and
      # not an empty run, because an empty run reports green after it checks
      # nothing.
      - name: Run all workspace checks
        run: node .github/scripts/run-workspace-checks.mjs
